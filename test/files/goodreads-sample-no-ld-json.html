<html>
<head><title>ignore</title></head>
<body>
<h1 class="Text Text__title1" data-testid="bookTitle">The Sandman, Vol. 1: Preludes &amp; Nocturnes</h1>
<div class="BookPageMetadataSection">
  <div class="BookPageMetadataSection__contributor">
    <h3 class="Text Text__title3 Text__regular" aria-label="List of contributors">
      <div class="ContributorLinksList">
        <span tabindex="-1">
          <a class="ContributorLink" href="https://www.goodreads.com/author/show/1.Neil_Gaiman">
            <span class="ContributorLink__name" data-testid="name">Neil Gaiman</span>
          </a>
          <span tabindex="-1">, </span>
          <a class="ContributorLink" href="https://www.goodreads.com/author/show/2.Sam_Kieth">
            <span class="ContributorLink__name" data-testid="name">Sam Kieth</span>
            <span data-testid="role" class="ContributorLink__role"> (Illustrator)</span>
          </a>
        </span>
      </div>
    </h3>
  </div>
</div>

<!-- Unrelated "About the author" widget further down the page, reusing the
     same ContributorLink__name class for the primary author. Without
     scoping the query to the contributor list container, this duplicates
     "Neil Gaiman" in the result. -->
<div class="FeaturedPerson__container">
  <div class="FeaturedPerson__info">
    <div class="FeaturedPerson__infoPrimary">
      <h4 class="Text Text__title4">
        <a class="ContributorLink" href="https://www.goodreads.com/author/show/1.Neil_Gaiman">
          <span class="ContributorLink__name" data-testid="name">Neil Gaiman</span>
        </a>
      </h4>
    </div>
  </div>
</div>
</body>
</html>
